<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Physics Sandbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui">
    <h2>Antigravity Core</h2>
    <label>
      Gravity Vector: <span id="grav-val">-0.35</span>
      <input type="range" id="gravity" min="-1.0" max="1.0" step="0.05" value="-0.35" />
    </label>
    <label>
      Damping (Air Friction): <span id="drag-val">0.985</span>
      <input type="range" id="drag" min="0.90" max="0.999" step="0.005" value="0.985" />
    </label>
    <button id="toggle-mode">Mode: Repel Cursor</button>
    <button id="reset-btn">Reset Field</button>
  </div>
  <canvas id="canvas"></canvas>
  <script src="app.js"></script>
</body>
</html>
